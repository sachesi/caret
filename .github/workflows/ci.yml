name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly, for advisories published since the last push, and against Rawhide, for what
  # the next Fedora's GTK, libadwaita and toolchain will break.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test${{ matrix.fedora != '44' && format(' on Fedora {0}', matrix.fedora) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ${{ github.event_name == 'schedule' && fromJSON('["44", "rawhide"]') || fromJSON('["44"]') }}
    container: registry.fedoraproject.org/fedora:${{ matrix.fedora }}
    steps:
      - name: Install the build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git-core rust cargo rustfmt clippy just blueprint-compiler
          gtk4-devel libadwaita-devel glib2-devel
          desktop-file-utils appstream gettext
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: just check
      - name: Test
        run: just test

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git-core gcc rustup blueprint-compiler
          gtk4-devel libadwaita-devel glib2-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check with the version Cargo.toml names
        run: |
          rustup-init -y --profile minimal --default-toolchain "$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          ~/.cargo/bin/cargo check --all-targets

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  release:
    name: Release
    needs: [check, msrv, deny]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write

  copr:
    name: Copr
    # After the release, whose files the build downloads.
    needs: release
    uses: ./.github/workflows/copr.yml
    # A called workflow sees no secrets unless the caller passes them on.
    secrets: inherit

  obs:
    name: OBS
    # After the release, whose files the build downloads.
    needs: release
    uses: ./.github/workflows/obs.yml
    permissions:
      contents: write
    # A called workflow sees no secrets unless the caller passes them on.
    secrets: inherit
