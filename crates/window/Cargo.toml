[package]
name = "caret"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A GPU-rendered terminal for Wayland"
repository.workspace = true
readme = "../../README.md"
publish = false

[dependencies]
accesskit = "0.25"
accesskit_unix = "0.24"
ash = "0.38"
# zbus runs its socket calls on this pool; from 1.7 its last thread never leaves, and
# wakes twice a second for as long as the window is open.
blocking = "~1.6.2"
caret-protocol.workspace = true
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
clap_complete_nushell = "4.6"
# Already in the build through hashbrown. The glyph of each cell drawn is looked up by it.
foldhash = "0.2"
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
harfrust = "0.13"
libc.workspace = true
rustix = { version = "1", features = ["event", "fs", "termios"] }
shlex = "2"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "system", "xkbcommon"] }
# Without its text and raster features: symbolic icons are shapes.
resvg = { version = "0.49", default-features = false }
swash = "0.2"
thiserror.workspace = true
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse"] }
tracing.workspace = true
tracing-subscriber.workspace = true
xkbcommon = { version = "0.8", default-features = false }
zbus = "5"

[lints]
workspace = true
