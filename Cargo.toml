[workspace]
members = ["crates/protocol", "crates/server", "crates/term", "crates/window"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/sachesi/caret"

[workspace.dependencies]
caret-protocol = { path = "crates/protocol" }
caret-term = { path = "crates/term" }
libc = "0.2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pixel, cell and texel arithmetic converts between i32, usize and floats everywhere,
# with values bounded by the size of a window or a texture.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# A terminal has lines and links, columns and colours.
similar_names = "allow"
# Colours read as 0xRRGGBB.
unreadable_literal = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
