# Weekly pull requests for the actions the workflows use, pinned by commit, and for the
# crates in Cargo.lock. Minor and patch updates of crates come as one pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Releases get a week to be found broken or compromised before they are proposed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Releases get a week to be found broken or compromised before they are proposed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    ignore:
      # From 1.7 its pool's last thread never leaves, and wakes the window twice a second.
      - dependency-name: blocking
        versions: [">=1.7"]
    groups:
      crates:
        update-types: [minor, patch]
