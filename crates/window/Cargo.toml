[package]
name = "caret-window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ash = "0.38"
caret-protocol.workspace = true
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap"] }
rustix = { version = "1", features = ["event", "fs", "termios"] }
rustybuzz = "0.20"
shlex = "1"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "system", "xkbcommon"] }
swash = "0.2"
thiserror.workspace = true
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse"] }
tracing.workspace = true
tracing-subscriber.workspace = true
xkbcommon = { version = "0.8", default-features = false }
zbus = "5"

[lints]
workspace = true
